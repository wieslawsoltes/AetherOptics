name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test optical kernel and application
        run: npm test
      - name: Build and validate standalone application
        run: |
          npm run build
          node --check dist/app.bundle.js
          node --check dist/worker.bundle.js
          test -s dist/index.html
          touch dist/.nojekyll
      - name: Upload tested site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  publish:
    name: Publish and verify GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      actions: read
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download tested site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-artifact" "$RUNNER_TEMP/pages-site"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name github-pages --dir "$RUNNER_TEMP/pages-artifact"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/pages-site"
      - name: Publish generated branch and verify live bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-pages.mjs "$RUNNER_TEMP/pages-site"
