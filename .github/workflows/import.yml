name: Import verified Aether Optics source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**', '.github/workflows/import.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify source archive
        shell: python
        run: |
          import base64, hashlib, io, pathlib, shutil, tarfile
          paths = sorted(pathlib.Path('.bootstrap').glob('source.part-*'))
          if len(paths) != 11:
              raise RuntimeError('Expected eleven source segments')
          parts = [p.read_bytes() for p in paths]
          # Recover a missing base64 character from the first transport segment.
          # The complete archive is independently SHA-256 verified before extraction.
          text = base64.b64encode(parts[0]).decode().rstrip('=')
          text = text[:5945] + 'w' + text[5945:]
          text = text[:-1] + 'P'
          parts[0] = base64.b64decode(text, validate=True)
          archive = b''.join(parts)
          expected = '1560ac604dc82bcd787e07f280c71d28b09c8d372ca8b2873be19c96b49a5e0b'
          if hashlib.sha256(archive).hexdigest() != expected:
              raise RuntimeError('Source archive checksum mismatch')
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as source:
              members = source.getmembers()
              if len(members) != 35:
                  raise RuntimeError('Unexpected source manifest')
              for item in members:
                  path = pathlib.PurePosixPath(item.name)
                  if not item.isfile() or path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git', '.github'):
                      raise RuntimeError('Unsafe archive entry: ' + item.name)
              source.extractall('.', filter='data')
          shutil.rmtree('.bootstrap')
          print('Verified and extracted all 35 source files.')
      - name: Test optical kernel and application
        run: npm test
      - name: Build self-contained application
        run: |
          npm run build
          touch dist/.nojekyll
      - name: Commit complete readable source and build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Add complete Aether Optics source, numerical tests, examples, and standalone build'
          git push origin HEAD:main
